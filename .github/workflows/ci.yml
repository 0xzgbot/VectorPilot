name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI must enforce the same bar as ./verify.sh — Release build, zero warnings, full
# suite. It previously built Debug with no warning gate, so a warning-clean local
# gate could pass while CI stayed green on code verify.sh would have rejected.
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VectorPilot.sln

      # Release, and any warning is an error. Same as verify.sh's build step.
      - name: Build (Release, warnings are errors)
        run: dotnet build VectorPilot.sln -c Release --no-restore -warnaserror

      - name: Test (full suite)
        run: dotnet test VectorPilot.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  # Publish the app the way the installer consumes it. Catches Release-only
  # publish breakage (trimming, missing content files) that a build alone misses.
  publish-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Publish exactly the way installer/installer.iss consumes it: self-contained
      # win-x64 into src/VectorPilot.App/bin/Release/net8.0-windows/win-x64/publish.
      - name: Publish (Release, self-contained win-x64)
        run: dotnet publish src/VectorPilot.App/VectorPilot.App.csproj -c Release -r win-x64 --self-contained

      - name: Verify the installer's source directory is populated
        shell: pwsh
        run: |
          $dir = "src/VectorPilot.App/bin/Release/net8.0-windows/win-x64/publish"
          $exe = Join-Path $dir "VectorPilot.exe"
          if (-not (Test-Path $exe)) { throw "installer source missing $exe" }
          $size = (Get-Item $exe).Length
          $count = (Get-ChildItem $dir -File).Count
          Write-Host "VectorPilot.exe = $size bytes; $count files in $dir"
          if ($size -lt 20000) { throw "VectorPilot.exe is implausibly small ($size bytes)" }
          if ($count -lt 10) { throw "publish output has only $count files" }
