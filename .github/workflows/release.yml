name: build-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained)
        # Output path MUST match installer/installer.iss [Files] source:
        # ..\src\VectorPilot.App\bin\Release\net8.0-windows\win-x64\publish\*
        run: dotnet publish src/VectorPilot.App/VectorPilot.App.csproj -c Release -r win-x64 --self-contained -o src/VectorPilot.App/bin/Release/net8.0-windows/win-x64/publish

      - name: Run test suite
        run: dotnet test VectorPilot.sln -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: vectorpilot-win-x64
          path: src/VectorPilot.App/bin/Release/net8.0-windows/win-x64/publish/**

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: vectorpilot-setup
          path: dist/*-setup.exe
